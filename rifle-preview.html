<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AK-12 步枪预览</title>
  <style>
    body { margin: 0; padding: 40px; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; color: #eee; }
    h1 { margin-bottom: 20px; font-weight: 300; }
    canvas { background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%); border-radius: 8px; }
  </style>
</head>
<body>
  <h1>AK-12 步枪预览</h1>
  <canvas id="canvas" width="1000" height="550"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const c = {
      metal: '#6b7280', metalLight: '#7a8288', metalDark: '#555c66',
      steel: '#4b5563', black: '#2d3748', blackDark: '#1a202c',
      tan: '#c4a574', tanDark: '#8b7355', rubber: '#1f2937'
    };
    
    function drawAK12(ctx, x, y, s) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      
      // ========== 枪托 ==========
      // 上支杆
      ctx.fillStyle = c.black;
      ctx.beginPath();
      ctx.moveTo(-115, -16);
      ctx.lineTo(-65, -16);
      ctx.lineTo(-65, -11);
      ctx.lineTo(-90, -11);
      ctx.lineTo(-100, -3);
      ctx.lineTo(-100, 3);
      ctx.lineTo(-90, 11);
      ctx.lineTo(-115, 11);
      ctx.closePath();
      ctx.fill();
      
      // 下支杆
      ctx.fillStyle = c.black;
      ctx.beginPath();
      ctx.moveTo(-115, 16);
      ctx.lineTo(-65, 16);
      ctx.lineTo(-65, 11);
      ctx.lineTo(-88, 11);
      ctx.lineTo(-97, 3);
      ctx.lineTo(-97, -3);
      ctx.lineTo(-88, -11);
      ctx.lineTo(-115, -11);
      ctx.closePath();
      ctx.fill();
      
      // 中央镂空
      ctx.fillStyle = '#0d1117';
      ctx.beginPath();
      ctx.moveTo(-108, -8);
      ctx.lineTo(-70, -8);
      ctx.lineTo(-70, -3);
      ctx.lineTo(-85, -3);
      ctx.lineTo(-95, 0);
      ctx.lineTo(-85, 3);
      ctx.lineTo(-70, 3);
      ctx.lineTo(-70, 8);
      ctx.lineTo(-108, 8);
      ctx.closePath();
      ctx.fill();
      
      // 斜撑
      ctx.fillStyle = c.blackDark;
      ctx.beginPath();
      ctx.moveTo(-95, -5);
      ctx.lineTo(-85, 0);
      ctx.lineTo(-95, 5);
      ctx.closePath();
      ctx.fill();
      
      // 枪托底板
      ctx.fillStyle = c.rubber;
      ctx.fillRect(-122, -18, 10, 36);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1;
      for (let i = 0; i < 9; i++) {
        ctx.beginPath();
        ctx.moveTo(-119, -15 + i * 4);
        ctx.lineTo(-115, -13 + i * 4);
        ctx.stroke();
      }
      
      // 连接座
      ctx.fillStyle = c.metalDark;
      ctx.fillRect(-68, -10, 12, 20);
      ctx.fillStyle = c.steel;
      ctx.beginPath();
      ctx.arc(-62, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      
      // 背带环
      ctx.fillStyle = c.blackDark;
      ctx.fillRect(-105, 13, 10, 6);
      ctx.fillStyle = c.steel;
      ctx.beginPath();
      ctx.arc(-100, 16, 3, 0, Math.PI * 2);
      ctx.fill();
      
      // ========== 下机匣 ==========
      ctx.fillStyle = c.metal;
      ctx.fillRect(-65, -16, 95, 32);
      
      // 铆钉
      ctx.fillStyle = c.metalDark;
      [[-55,-10],[-55,10],[5,-10],[5,10],[30,-10],[30,10]].forEach(([vx,vy]) => {
        ctx.beginPath();
        ctx.arc(vx, vy, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // 机匣盖
      ctx.fillStyle = c.metalDark;
      ctx.beginPath();
      ctx.moveTo(-65, -16);
      ctx.lineTo(-48, -16);
      ctx.quadraticCurveTo(-22, -24, 12, -16);
      ctx.lineTo(28, -16);
      ctx.lineTo(28, -11);
      ctx.lineTo(-65, -11);
      ctx.closePath();
      ctx.fill();
      
      // 机匣盖锁
      ctx.fillStyle = c.steel;
      ctx.fillRect(25, -18, 10, 7);
      
      // 抛壳窗
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(-35, -13, 42, 19);
      
      // 拉机柄
      ctx.fillStyle = c.metalDark;
      ctx.beginPath();
      ctx.moveTo(-10, -7);
      ctx.lineTo(22, -7);
      ctx.lineTo(22, -3);
      ctx.lineTo(12, -3);
      ctx.lineTo(8, 2);
      ctx.lineTo(-10, 2);
      ctx.closePath();
      ctx.fill();
      
      // 快慢机
      ctx.fillStyle = c.black;
      ctx.beginPath();
      ctx.moveTo(-52, -4);
      ctx.lineTo(-8, -4);
      ctx.lineTo(-5, 4);
      ctx.lineTo(-20, 10);
      ctx.lineTo(-55, 10);
      ctx.lineTo(-60, 4);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = c.blackDark;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(-48 + i * 8, 0);
        ctx.lineTo(-42 + i * 8, 8);
        ctx.stroke();
      }
      
      ctx.fillStyle = '#fff';
      [-12, -22, -32].forEach(vx => {
        ctx.beginPath();
        ctx.arc(vx, 8, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // ========== 顶部导轨 ==========
      ctx.fillStyle = c.black;
      ctx.fillRect(-62, -24, 85, 8);
      ctx.fillStyle = c.blackDark;
      for (let i = 0; i < 18; i++) {
        ctx.fillRect(-60 + i * 5, -24, 3, 8);
      }
      
      // 后照门
      ctx.fillStyle = c.steel;
      ctx.fillRect(20, -24, 16, 10);
      ctx.fillStyle = '#000';
      ctx.fillRect(24, -21, 10, 5);
      
      // ========== 导气系统 ==========
      ctx.fillStyle = c.metal;
      ctx.fillRect(32, -9, 48, 14);
      
      ctx.fillStyle = c.steel;
      ctx.fillRect(76, -12, 8, 20);
      
      ctx.fillStyle = c.black;
      ctx.beginPath();
      ctx.arc(80, -12, 4, 0, Math.PI * 2);
      ctx.fill();
      
      // 准星
      ctx.fillStyle = c.steel;
      ctx.fillRect(78, -24, 12, 14);
      ctx.strokeStyle = c.steel;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(84, -22, 7, Math.PI, 0);
      ctx.stroke();
      ctx.fillStyle = c.black;
      ctx.fillRect(83, -26, 2, 5);
      
      // ========== 枪管 ==========
      ctx.fillStyle = c.metalDark;
      ctx.fillRect(90, -6, 75, 12);
      
      ctx.strokeStyle = c.steel;
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(100 + i * 12, -6);
        ctx.lineTo(100 + i * 12, 6);
        ctx.stroke();
      }
      
      // 消焰器
      ctx.fillStyle = c.black;
      ctx.fillRect(165, -9, 24, 18);
      ctx.fillStyle = c.steel;
      ctx.fillRect(172, -10, 12, 20);
      ctx.fillStyle = '#000';
      ctx.fillRect(182, -5, 6, 10);
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(168 + i * 3, -8, 2, 5);
        ctx.fillRect(168 + i * 3, 3, 2, 5);
      }
      
      // ========== 护木 ==========
      ctx.fillStyle = c.black;
      ctx.fillRect(32, -8, 52, 6);
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = c.blackDark;
        ctx.fillRect(34 + i * 4.5, -8, 3, 6);
      }
      
      ctx.fillStyle = c.tan;
      ctx.fillRect(34, 4, 62, 24);
      
      ctx.fillStyle = c.black;
      ctx.fillRect(36, 26, 56, 6);
      for (let i = 0; i < 13; i++) {
        ctx.fillStyle = c.blackDark;
        ctx.fillRect(38 + i * 4.5, 26, 3, 6);
      }
      
      for (let i = 0; i < 7; i++) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(38 + i * 8, 10, 6, 12);
      }
      
      ctx.fillStyle = c.blackDark;
      ctx.fillRect(62, 32, 8, 10);
      ctx.fillStyle = c.steel;
      ctx.beginPath();
      ctx.arc(66, 37, 3, 0, Math.PI * 2);
      ctx.fill();
      
      // ========== 弹匣 ==========
      ctx.fillStyle = c.black;
      ctx.beginPath();
      ctx.moveTo(-12, 16);
      ctx.lineTo(14, 16);
      ctx.quadraticCurveTo(28, 22, 32, 40);
      ctx.lineTo(36, 75);
      ctx.quadraticCurveTo(28, 82, 16, 78);
      ctx.lineTo(12, 45);
      ctx.quadraticCurveTo(8, 32, 2, 22);
      ctx.lineTo(-8, 18);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = c.blackDark;
      ctx.lineWidth = 2;
      for (let i = 0; i < 11; i++) {
        ctx.beginPath();
        const y = 24 + i * 5;
        ctx.moveTo(0, y);
        ctx.quadraticCurveTo(14, y + 5, 32, y + 10);
        ctx.stroke();
      }
      
      ctx.fillStyle = 'rgba(150, 110, 70, 0.5)';
      ctx.fillRect(14, 48, 14, 22);
      
      ctx.fillStyle = c.steel;
      ctx.beginPath();
      ctx.arc(12, 14, 4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = c.metalDark;
      ctx.fillRect(-12, 16, 26, 4);
      
      // ========== 握把 ==========
      ctx.fillStyle = c.tanDark;
      ctx.beginPath();
      ctx.moveTo(-10, 16);
      ctx.lineTo(8, 16);
      ctx.lineTo(6, 52);
      ctx.lineTo(-12, 54);
      ctx.lineTo(-18, 42);
      ctx.closePath();
      ctx.fill();
      
      ctx.strokeStyle = c.blackDark;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-7 + i * 3, 22);
        ctx.quadraticCurveTo(-5 + i * 3, 35, -4 + i * 3, 48);
        ctx.stroke();
      }
      
      ctx.fillStyle = c.blackDark;
      for (let i = 0; i < 7; i++) {
        ctx.fillRect(-15, 20 + i * 3, 6, 1.5);
      }
      
      // 扳机护圈
      ctx.strokeStyle = c.black;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(10, 16);
      ctx.lineTo(10, 28);
      ctx.quadraticCurveTo(18, 32, 28, 28);
      ctx.lineTo(28, 18);
      ctx.stroke();
      
      // 扳机
      ctx.fillStyle = c.steel;
      ctx.beginPath();
      ctx.moveTo(16, 17);
      ctx.quadraticCurveTo(18, 24, 17, 29);
      ctx.lineTo(14, 28);
      ctx.quadraticCurveTo(15, 23, 14, 17);
      ctx.closePath();
      ctx.fill();
      
      // ========== 细节 ==========
      ctx.fillStyle = c.steel;
      ctx.fillRect(28, -14, 12, 28);
      ctx.strokeStyle = c.metalDark;
      ctx.lineWidth = 2;
      ctx.strokeRect(30, -12, 8, 24);
      
      ctx.fillStyle = c.metalLight;
      ctx.fillRect(-60, 6, 18, 8);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(-57 + i * 4, 7);
        ctx.lineTo(-55 + i * 4, 13);
        ctx.stroke();
      }
      
      ctx.fillStyle = c.steel;
      ctx.beginPath();
      ctx.arc(-68, 0, 3, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.restore();
    }
    
    function render() {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 20) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 20) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
      
      drawAK12(ctx, canvas.width / 2, canvas.height / 2, 2.0);
    }
    
    render();
  </script>
</body>
</html>
